name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - dev
      - staging
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Check out library
        uses: actions/checkout@v6
        with:
          path: semafore-crypto

      - name: Check out shared vectors
        uses: actions/checkout@v6
        with:
          repository: attomus-sf/sf-shared-docs
          ref: dev
          path: sf-shared-docs
          token: ${{ secrets.SHARED_DOCS_READ_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: '@attomus'
          cache: npm
          cache-dependency-path: semafore-crypto/package-lock.json

      - name: Install dependencies
        working-directory: semafore-crypto
        run: npm ci

      - name: Run dependency audit
        working-directory: semafore-crypto
        run: npm audit --audit-level=high

      - name: Lint
        working-directory: semafore-crypto
        run: npm run lint

      - name: Type-check
        working-directory: semafore-crypto
        run: npm run check

      - name: Test
        working-directory: semafore-crypto
        env:
          SEMAFORE_TEST_VECTORS_DIR: ../sf-shared-docs/docs/test-vectors
        run: npm run test

      - name: Build
        working-directory: semafore-crypto
        run: npm run build

      - name: Publish dry-run
        if: github.event_name == 'pull_request'
        working-directory: semafore-crypto
        run: npm pack --dry-run --json

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Check out library
        uses: actions/checkout@v6
        with:
          path: semafore-crypto

      - name: Check out shared vectors
        uses: actions/checkout@v6
        with:
          repository: attomus-sf/sf-shared-docs
          ref: dev
          path: sf-shared-docs
          token: ${{ secrets.SHARED_DOCS_READ_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: '@attomus'
          package-manager-cache: false

      - name: Install dependencies
        working-directory: semafore-crypto
        run: npm ci

      - name: Validate tag matches package version
        working-directory: semafore-crypto
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $package_version." >&2
            exit 1
          fi

      - name: Check version is unpublished
        working-directory: semafore-crypto
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          set +e
          lookup_output="$(npm view "${package_name}@${package_version}" version --json 2>&1)"
          lookup_status=$?
          set -e

          if [[ $lookup_status -eq 0 ]]; then
            echo "${package_name}@${package_version} is already published; refusing to publish it again." >&2
            exit 1
          fi
          if ! grep -q 'E404' <<<"$lookup_output"; then
            echo "$lookup_output" >&2
            exit "$lookup_status"
          fi

          echo "${package_name}@${package_version} is available for publication."

      - name: Verify release
        working-directory: semafore-crypto
        env:
          SEMAFORE_TEST_VECTORS_DIR: ../sf-shared-docs/docs/test-vectors
        run: npm run verify

      - name: Publish tagged release
        working-directory: semafore-crypto
        run: npm publish --access public --provenance
